# =====================================================
# Backend Performance Lab — full local stack
# Stage 1: postgres + redis
# Stage 2: 5 Go services built from local source
# =====================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labpass}
      POSTGRES_DB: ${POSTGRES_DB:-labdb}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lab} -d ${POSTGRES_DB:-labdb}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lab-net]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru'
      ]
    ports:
      - '${REDIS_PORT:-56379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lab-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # ---------- Stage 2: Go services ----------
  # Each service is built from source via Dockerfile in docker/<service>.
  # Override image names with *_IMAGE env vars in Stage 3 (image variants).

  user-service:
    build:
      context: .
      dockerfile: docker/user-service/Dockerfile
      args:
        SERVICE: user-service
    container_name: lab-user-service
    environment:
      PORT: '8081'
      DATABASE_URL: postgres://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-labpass}@postgres:5432/${POSTGRES_DB:-labdb}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL:-5m}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [lab-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  product-service:
    build:
      context: .
      dockerfile: docker/product-service/Dockerfile
      args:
        SERVICE: product-service
    container_name: lab-product-service
    environment:
      PORT: '8082'
      DATABASE_URL: postgres://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-labpass}@postgres:5432/${POSTGRES_DB:-labdb}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL:-5m}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [lab-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  order-service:
    build:
      context: .
      dockerfile: docker/order-service/Dockerfile
      args:
        SERVICE: order-service
    container_name: lab-order-service
    environment:
      PORT: '8083'
      DATABASE_URL: postgres://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-labpass}@postgres:5432/${POSTGRES_DB:-labdb}?sslmode=disable
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      UPSTREAM_TIMEOUT: 3s
    depends_on:
      postgres: { condition: service_healthy }
      user-service: { condition: service_started }
      product-service: { condition: service_started }
    networks: [lab-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service/Dockerfile
      args:
        SERVICE: notification-service
    container_name: lab-notification-service
    environment:
      PORT: '8084'
    networks: [lab-net]
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }

  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway/Dockerfile
      args:
        SERVICE: api-gateway
    container_name: lab-api-gateway
    environment:
      PORT: '8080'
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      UPSTREAM_TIMEOUT: 5s
    ports:
      - '${API_GATEWAY_PORT:-8080}:8080'
    depends_on:
      - user-service
      - product-service
      - order-service
      - notification-service
    networks: [lab-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }

volumes:
  postgres_data:
  redis_data:

networks:
  lab-net:
    driver: bridge
