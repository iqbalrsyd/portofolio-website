syntax = "proto3";

package product;

option go_package = "github.com/iqbalrasyad/grpc-rest-go/proto/pb";

// Category represents product category
message Category {
  int32 id = 1;
  string name = 2;
  string slug = 3;
}

// Attribute represents a product attribute (size, color, etc)
message Attribute {
  string key = 1;
  string value = 2;
}

// Tag represents a product tag
message Tag {
  int32 id = 1;
  string name = 2;
}

// Supplier represents a product supplier
message Supplier {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string country = 5;
}

// Inventory represents stock information
message Inventory {
  int32 warehouse_id = 1;
  string warehouse_name = 2;
  int32 quantity = 3;
  int32 reserved = 4;
}

// Product represents a product in the system (enhanced)
message Product {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string detailed_description = 4;
  float price = 5;
  float discount_price = 6;
  int32 stock = 7;
  
  // Complex nested fields
  Category category = 8;
  repeated Attribute attributes = 9;
  repeated Tag tags = 10;
  repeated Supplier suppliers = 11;
  repeated Inventory inventory = 12;
  
  // Metadata
  string sku = 13;
  string barcode = 14;
  repeated string images = 15;
  int32 rating = 16;
  int32 review_count = 17;
  bool is_featured = 18;
  string created_at = 19;
  string updated_at = 20;
}

// SimpleProduct for lightweight benchmarks
message SimpleProduct {
  int32 id = 1;
  string name = 2;
  string description = 3;
  float price = 4;
  int32 stock = 5;
}

// CreateProductRequest contains product creation data
message CreateProductRequest {
  string name = 1;
  string description = 2;
  float price = 3;
  int32 stock = 4;
}

// GetProductRequest requests a product by ID
message GetProductRequest {
  int32 id = 1;
  bool include_details = 2; // if true, return full Product; if false return SimpleProduct
}

// ListProductsRequest requests all products
message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
  bool include_details = 3;
}

// ListProductsResponse contains all products
message ListProductsResponse {
  repeated Product products = 1;
  int32 count = 2;
  int32 total = 3;
}

// SimpleListProductsResponse for lightweight benchmarks
message SimpleListProductsResponse {
  repeated SimpleProduct products = 1;
  int32 count = 2;
}

// UpdateProductRequest contains product update data
message UpdateProductRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  float price = 4;
  int32 stock = 5;
}

// DeleteProductRequest requests product deletion
message DeleteProductRequest {
  int32 id = 1;
}

// DeleteProductResponse is returned after successful deletion
message DeleteProductResponse {
  bool success = 1;
}

// ErrorResponse contains error information
message ErrorResponse {
  string error = 1;
}
